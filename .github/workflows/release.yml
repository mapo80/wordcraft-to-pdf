# Cuts a release: builds and tests every platform (build.yml), packs the native archives, the
# NuGet packages and the Maven artifacts with the release version, and publishes them as a
# GitHub Release. Publishing to nuget.org / Maven Central / GitHub Packages is optional and
# skipped when its credentials are not configured.
#
# Trigger: push a tag vX.Y.Z[-pre], or run it manually with a version (the tag vX.Y.Z is then
# created on the selected commit).
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, without the leading v (e.g. 0.2.0 or 0.2.0-preview.1)"
        required: true
        type: string

permissions:
  contents: read

env:
  JAVA_VERSION: "21"
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve and validate
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if ! [[ "$version" =~ $semver ]]; then
            echo "::error::'$version' is not a semantic version (X.Y.Z[-prerelease][+build])"
            exit 1
          fi
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Refuse to attach this commit's binaries to a tag that points elsewhere.
            existing="$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)"
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              existing_commit="$(git ls-remote --tags origin "refs/tags/$tag^{}" | cut -f1)"
              if [ "${existing_commit:-$existing}" != "$GITHUB_SHA" ]; then
                echo "::error::tag $tag already exists on another commit (${existing_commit:-$existing})"
                exit 1
              fi
            fi
          fi
          crate_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$crate_version" != "${version%%[-+]*}" ]; then
            echo "::warning::Cargo.toml workspace version is $crate_version; build-metadata.json will report it, not $version"
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (prerelease: $prerelease)"

  build:
    name: Build and test
    needs: version
    uses: ./.github/workflows/build.yml

  package:
    name: Package
    needs: [version, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # The tests target net8.0 and net10.0.
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Download native artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts

      - name: Check native artifacts
        run: |
          set -euo pipefail
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64; do
            case "$rid" in win-*) exe=.exe ;; *) exe= ;; esac
            worker="artifacts/native-$rid/bin/wcpdf_worker$exe"
            [ -f "$worker" ] || { echo "::error::missing $worker"; exit 1; }
            # Artifacts do not keep file modes.
            chmod +x "$worker"
            echo "$rid: $(wc -c < "$worker") bytes, target $(sed -n 's/.*"target": "\(.*\)".*/\1/p' "artifacts/native-$rid/build-metadata.json")"
          done

      - name: Native archives
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64; do
            name="wordcraftpdf-native-$rid-$VERSION"
            stage="$RUNNER_TEMP/archives/$name"
            mkdir -p "$stage"
            cp -R "artifacts/native-$rid/." "$stage/"
            case "$rid" in
              win-*) (cd "$RUNNER_TEMP/archives" && zip -qr -X "$GITHUB_WORKSPACE/dist/$name.zip" "$name") ;;
              *)     tar -C "$RUNNER_TEMP/archives" --owner=0 --group=0 -czf "dist/$name.tar.gz" "$name" ;;
            esac
          done
          ls -l dist

      - name: Pack NuGet packages
        run: |
          set -euo pipefail
          a="$GITHUB_WORKSPACE/artifacts"
          # pack-nuget.sh packs one OS per call (x64 first for Linux/Windows, arm64 first for
          # macOS) and the managed WordCraftPdf package every time; VERSION sets the version.
          bash scripts/pack-nuget.sh linux   "$a/native-linux-x64" "$a/native-linux-arm64"
          bash scripts/pack-nuget.sh macos   "$a/native-osx-arm64" "$a/native-osx-x64"
          bash scripts/pack-nuget.sh windows "$a/native-win-x64"   "$a/native-win-arm64"

          check() {  # check <package> <entry>...
            local pkg="dotnet/nupkgs/$1.$VERSION.nupkg" entry listing
            [ -f "$pkg" ] || { echo "::error::missing $pkg"; exit 1; }
            shift
            listing="$(unzip -Z1 "$pkg")"
            for entry in "$@"; do
              grep -qxF "$entry" <<< "$listing" || { echo "::error::$pkg lacks $entry"; exit 1; }
            done
            cp "$pkg" dist/
          }
          check WordCraftPdf lib/net8.0/WordCraftPdf.dll lib/netstandard2.0/WordCraftPdf.dll
          check WordCraftPdf.NativeAssets.Linux \
            runtimes/linux-x64/native/wcpdf_worker runtimes/linux-arm64/native/wcpdf_worker
          check WordCraftPdf.NativeAssets.macOS \
            runtimes/osx-arm64/native/wcpdf_worker runtimes/osx-x64/native/wcpdf_worker
          check WordCraftPdf.NativeAssets.Windows \
            runtimes/win-x64/native/wcpdf_worker.exe runtimes/win-arm64/native/wcpdf_worker.exe
          ls -l dist/*.nupkg

      - name: Pack Maven artifacts
        run: |
          set -euo pipefail
          a="$GITHUB_WORKSPACE/artifacts"
          # pack-maven.sh takes the version from java/pom.xml: set the release version first.
          mvn -B -ntp -q -f java/pom.xml \
            org.codehaus.mojo:versions-maven-plugin:2.17.1:set \
            -DnewVersion="$VERSION" -DgenerateBackupPoms=false -DprocessAllModules=true
          # Tests already ran against every platform's worker in build.yml.
          SKIP_TESTS=1 bash scripts/pack-maven.sh \
            linux-x64="$a/native-linux-x64" linux-arm64="$a/native-linux-arm64" \
            osx-arm64="$a/native-osx-arm64" osx-x64="$a/native-osx-x64" \
            win-x64="$a/native-win-x64" win-arm64="$a/native-win-arm64"

          # -sources / -javadoc jars, and a standalone POM (parent resolved, name/description/
          # url/licenses/developers/scm kept) so the artifact needs no parent POM in the repository.
          mvn -B -ntp -f java/pom.xml -pl wordcraftpdf \
            org.apache.maven.plugins:maven-source-plugin:3.3.1:jar-no-fork \
            org.apache.maven.plugins:maven-javadoc-plugin:3.11.2:jar \
            org.codehaus.mojo:flatten-maven-plugin:1.6.0:flatten -Dflatten.mode=ossrh

          t=java/wordcraftpdf/target
          cp "$t/wordcraftpdf-$VERSION.jar" "$t/wordcraftpdf-$VERSION-sources.jar" \
             "$t/wordcraftpdf-$VERSION-javadoc.jar" dist/
          cp java/wordcraftpdf/.flattened-pom.xml "dist/wordcraftpdf-$VERSION.pom"
          listing="$(unzip -Z1 "dist/wordcraftpdf-$VERSION.jar")"
          for rid in linux-x64 linux-arm64 osx-arm64 osx-x64 win-x64 win-arm64; do
            case "$rid" in win-*) exe=wcpdf_worker.exe ;; *) exe=wcpdf_worker ;; esac
            grep -qxF "native/$rid/$exe" <<< "$listing" \
              || { echo "::error::JAR lacks native/$rid/$exe"; exit 1; }
          done
          ls -l dist/*.jar dist/*.pom

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          rm -f SHA256SUMS
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS

      - name: Release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          wc_version="$(tr -d '[:space:]' < WORDCRAFT_VERSION)"
          cat > dist-notes.md <<EOF
          WordCraftPdf $TAG, built on WordCraft $wc_version.

          **.NET**: \`dotnet add package WordCraftPdf --version $VERSION\` plus the native assets for
          your platform: \`WordCraftPdf.NativeAssets.Linux\`, \`.macOS\` or \`.Windows\`.

          **Java**: \`com.wordcraftpdf:wordcraftpdf:$VERSION\` (the JAR bundles the worker for
          linux-x64, linux-arm64, osx-arm64, osx-x64, win-x64 and win-arm64).

          **C / native**: \`wordcraftpdf-native-<rid>-$VERSION\` archives contain \`bin/wcpdf_worker\`,
          the C API library (\`lib/\`), \`include/wcpdf.h\`, licenses and \`build-metadata.json\`.

          Verify downloads with \`sha256sum -c SHA256SUMS\`.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: |
            dist/
            dist-notes.md
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: GitHub Release
    needs: [version, package]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          # Used only when the tag does not exist yet (manual runs).
          target_commitish: ${{ github.sha }}
          name: WordCraftPdf ${{ needs.version.outputs.tag }}
          body_path: release/dist-notes.md
          generate_release_notes: true
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          fail_on_unmatched_files: true
          files: |
            release/dist/*.nupkg
            release/dist/*.jar
            release/dist/*.pom
            release/dist/*.tar.gz
            release/dist/*.zip
            release/dist/SHA256SUMS

  publish-nuget:
    name: Publish to nuget.org
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - uses: actions/setup-dotnet@v4
        with:
          # The tests target net8.0 and net10.0.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: dotnet nuget push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$NUGET_API_KEY" ]; then
            echo "::notice::NUGET_API_KEY is not set; skipping nuget.org"
            exit 0
          fi
          # Native assets first, so WordCraftPdf never appears without them.
          for pkg in release/dist/WordCraftPdf.NativeAssets.*.nupkg release/dist/WordCraftPdf.[0-9]*.nupkg; do
            echo "Pushing $(basename "$pkg")"
            dotnet nuget push "$pkg" --api-key "$NUGET_API_KEY" \
              --source https://api.nuget.org/v3/index.json --skip-duplicate --timeout 600
          done

  publish-maven-central:
    name: Publish to Maven Central
    needs: [version, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - name: Sign and upload to the Central Portal
        env:
          CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "$CENTRAL_USERNAME" ] || [ -z "$CENTRAL_PASSWORD" ] || [ -z "$GPG_PRIVATE_KEY" ]; then
            echo "::notice::Maven Central credentials (MAVEN_CENTRAL_USERNAME/PASSWORD, MAVEN_GPG_PRIVATE_KEY) are not set; skipping"
            exit 0
          fi
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          mkdir -p "$GNUPGHOME" && chmod 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import

          # Bundle layout: com/wordcraftpdf/wordcraftpdf/<version>/<files> with .asc, .md5, .sha1.
          dir="$RUNNER_TEMP/bundle/com/wordcraftpdf/wordcraftpdf/$VERSION"
          mkdir -p "$dir"
          cp release/dist/wordcraftpdf-"$VERSION".pom release/dist/wordcraftpdf-"$VERSION"*.jar "$dir/"
          for f in "$dir"/*; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
              --armor --detach-sign --output "$f.asc" "$f"
            md5sum "$f" | cut -d' ' -f1 > "$f.md5"
            sha1sum "$f" | cut -d' ' -f1 > "$f.sha1"
          done
          (cd "$RUNNER_TEMP/bundle" && zip -qr "$RUNNER_TEMP/central-bundle.zip" com)

          token="$(printf '%s:%s' "$CENTRAL_USERNAME" "$CENTRAL_PASSWORD" | base64 -w0)"
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $token" \
            -F "bundle=@$RUNNER_TEMP/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?name=wordcraftpdf-$VERSION&publishingType=AUTOMATIC"
          echo
          echo "Uploaded; the Central Portal validates and publishes the deployment asynchronously."

  publish-github-packages:
    name: Publish to GitHub Packages (Maven)
    needs: [version, github-release]
    # Opt-in: set the repository variable PUBLISH_GITHUB_PACKAGES to 'true'.
    if: vars.PUBLISH_GITHUB_PACKAGES == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: release

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: mvn deploy:deploy-file
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          d=release/dist
          mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.3:deploy-file \
            -DrepositoryId=github \
            -Durl="https://maven.pkg.github.com/${GITHUB_REPOSITORY}" \
            -DpomFile="$d/wordcraftpdf-$VERSION.pom" \
            -Dfile="$d/wordcraftpdf-$VERSION.jar" \
            -Dsources="$d/wordcraftpdf-$VERSION-sources.jar" \
            -Djavadoc="$d/wordcraftpdf-$VERSION-javadoc.jar"
